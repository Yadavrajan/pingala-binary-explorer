<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piṅgala Binary Explorer - IKS CS Simulation</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Auth Overlay Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h2 id="auth-title" class="text-xl font-bold text-center text-amber-400 mb-2">Welcome to Piṅgala Explorer</h2>
            <p id="auth-subtitle" class="text-xs text-center text-slate-400 mb-6">Sign in to access the application</p>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required placeholder="user@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg transition">Sign In</button>
            </form>
            
            <div class="mt-4 text-center">
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-xs text-sky-400 hover:underline">Need an account? Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Main Application Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-400">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-100 tracking-wide">Piṅgala Binary Explorer</h1>
                    <p class="text-xs text-amber-400 font-medium">IKS in Computational Systems</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="user-display" class="text-xs font-mono text-emerald-400 bg-emerald-950/40 border border-emerald-800 px-2 py-1 rounded hidden"></span>
                <button id="logout-btn" onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-slate-300 hidden">Logout</button>
            </div>
        </div>
    </header>

    <!-- App Body Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 opacity-30 pointer-events-none transition-opacity duration-300" id="main-content">
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-xl">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-amber-400"></i> Prastāra Generator Controls
                </h2>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="pattern-len" class="text-sm font-medium text-slate-300">Pattern Length (n bits)</label>
                            <span id="len-val" class="text-amber-400 font-mono font-bold text-sm">3</span>
                        </div>
                        <input type="range" id="pattern-len" min="1" max="6" value="3" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-400">
                    </div>
                </div>
            </div>
        </section>

        <section class="lg:col-span-7">
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-xl">
                <div class="overflow-x-auto border border-slate-800 rounded-lg">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-slate-400 text-xs uppercase font-mono border-b border-slate-800">
                                <th class="p-3">Index</th>
                                <th class="p-3">Binary Vector</th>
                            </tr>
                        </thead>
                        <tbody id="prastara-tbody" class="font-mono text-sm divide-y divide-slate-800/60"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();
        let isSignUp = false;

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').textContent = isSignUp ? 'Create Account' : 'Welcome to Piṅgala Explorer';
            document.getElementById('auth-btn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('toggle-auth-btn').textContent = isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            localStorage.setItem('user', email);
            showApp(email);
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        function showApp(email) {
            document.getElementById('auth-modal').classList.add('hidden');
            const main = document.getElementById('main-content');
            main.classList.remove('opacity-30', 'pointer-events-none');
            document.getElementById('user-display').textContent = email;
            document.getElementById('user-display').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
        }

        // Auto login check
        const activeUser = localStorage.getItem('user');
        if (activeUser) showApp(activeUser);

        // App logic
        const rangeInput = document.getElementById('pattern-len');
        function renderPrastara(n) {
            document.getElementById('len-val').textContent = n;
            let html = '';
            for (let i = 0; i < (1 << n); i++) {
                html += `<tr class="border-b border-slate-800"><td class="p-3 text-slate-400">${i}</td><td class="p-3 text-amber-400 font-bold">${i.toString(2).padStart(n, '0')}</td></tr>`;
            }
            document.getElementById('prastara-tbody').innerHTML = html;
        }
        rangeInput.addEventListener('input', (e) => renderPrastara(parseInt(e.target.value)));
        renderPrastara(3);
    </script>
</body>
</html>
